<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Quill feather classic">
  <defs>
    <linearGradient id="fv" x1="30" y1="20" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C6BB5"/>
      <stop offset="1" stop-color="#2B2D6E"/>
    </linearGradient>
    <linearGradient id="fs" x1="40" y1="16" x2="96" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-28 64 64)">
    <!-- feather outline: pointed tip, full vane, tapered base into nib -->
    <path fill="url(#fv)" d="M64 8
      C78 18 92 40 90 62
      C88 78 78 88 70 94
      L70 108
      L64 124
      L58 108
      L58 94
      C50 88 40 78 38 62
      C36 40 50 18 64 8Z"/>
    <!-- inner cut for feather split look -->
    <path fill="#3D3478" opacity="0.35" d="M64 16
      C70 28 74 44 74 60
      C74 72 70 82 66 88
      L64 92 L62 88
      C58 82 54 72 54 60
      C54 44 58 28 64 16Z"/>
    <!-- rachis -->
    <path stroke="url(#fs)" stroke-width="2.8" stroke-linecap="round" d="M64 14 L64 108"/>
    <!-- barbs -->
    <g stroke="#DDD6FE" stroke-opacity="0.5" stroke-width="1.15" stroke-linecap="round">
      <path d="M62 24 L48 34"/><path d="M62 34 L44 46"/><path d="M62 44 L42 56"/>
      <path d="M62 54 L44 66"/><path d="M62 64 L48 74"/><path d="M62 74 L52 82"/>
      <path d="M66 24 L80 34"/><path d="M66 34 L84 46"/><path d="M66 44 L86 56"/>
      <path d="M66 54 L84 66"/><path d="M66 64 L80 74"/><path d="M66 74 L76 82"/>
    </g>
    <!-- nib plate -->
    <path fill="#1E1F4A" d="M56 106 L60 110 L64 124 L68 110 L72 106 L66 104 L64 106 L62 104Z"/>
    <circle cx="64" cy="112" r="2.2" fill="#EDE9FE"/>
    <path stroke="#EDE9FE" stroke-width="1.3" d="M64 110 V120"/>
  </g>
</svg>
